name: Build Anomaly NTE Vehicle Host (git patch)

on:
  push:
    branches:
      - feature/nte-vehicle-anomaly-host

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Apply NTE Vehicle host patch
        shell: pwsh
        run: |
          git apply --check --whitespace=nowarn .patches/nte-vehicle-0.6.0.git.patch
          git apply --whitespace=nowarn .patches/nte-vehicle-0.6.0.git.patch
      - name: Build Anomaly
        shell: cmd
        run: build.cmd package
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: Anomaly-NTE-Vehicle-Host-windows-x64
          path: .build/windows-vs2022/game-package/**
          if-no-files-found: error
          compression-level: 6

# patch-normalized

