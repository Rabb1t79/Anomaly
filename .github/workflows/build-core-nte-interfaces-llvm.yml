name: Build Anomaly Core NTE Interfaces

on:
  push:
    branches:
      - build/windows-core-nte-interfaces-20261008
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: .github/scripts/build-core-nte.ps1
      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: Anomaly-Core-NTE-interfaces-LLVM
          path: artifact
          if-no-files-found: error
